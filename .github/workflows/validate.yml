name: validate

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: pip install "jsonschema==4.26.0"

      - name: Validate portfolio contract
        shell: pwsh
        run: |
          $status = (Select-String -Path project.yaml -Pattern '^status:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          if ($status -in @('planned', 'scaffolded', 'implemented')) {
            ./tools/validate-project.ps1 -SkipDocker -AllowPendingEvidence
          } else {
            ./tools/validate-project.ps1 -SkipDocker
          }

      - name: Validate committed publication evidence
        run: PYTHONPATH=tools python tools/validate_publication.py

      - name: Build reproducible image
        run: docker build --tag mlops-end2end:${{ github.sha }} .

      - name: Lint
        run: docker run --rm --entrypoint ruff mlops-end2end:${{ github.sha }} check src tests dags

      - name: Test complete suite
        run: docker run --rm --entrypoint pytest mlops-end2end:${{ github.sha }} -q

      - name: Test core with focused coverage
        run: >-
          docker run --rm --entrypoint pytest mlops-end2end:${{ github.sha }}
          tests/test_quality.py tests/test_data.py tests/test_runner.py
          --cov=mlops_end2end.domain
          --cov=mlops_end2end.application
          --cov=mlops_end2end.adapters.data
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Run train-to-production benchmark
        run: |
          mkdir -p benchmarks/results
          # The image runs as uid 50000 (airflow), which cannot write into a
          # bind mount owned by the runner user. Write inside the container and
          # copy the artifact out instead of coupling to host ownership.
          docker run --name benchmark \
            --env BENCHMARK_OUTPUT=/tmp/ci.json \
            mlops-end2end:${{ github.sha }}
          docker cp benchmark:/tmp/ci.json benchmarks/results/ci.json
          docker rm benchmark
          python -m json.tool benchmarks/results/ci.json >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: mlops-end2end-benchmark
          path: benchmarks/results/ci.json
