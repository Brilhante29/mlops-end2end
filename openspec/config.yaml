schema: portfolio-system
references:
  - portfolio-reuse-kit
context: |
  Project: mlops-end2end (#21)
  Program: mlops-data-platform
  Claim: move a deterministic model from validated data to a monitored, alias-backed API and measure time to production.
  Source of truth:
    - Use `.portfolio/` as the local snapshot of portfolio-reuse-kit.
    - Use `project.yaml` for the public project contract.
    - Use `sdd/` for durable lightweight decisions.
    - Use `openspec/changes/ship-mlops-end2end/` for approved scope, requirements, self-challenge, and tasks.
  Core rules:
    - Prove one measurable lifecycle claim.
    - Keep domain/application policy independent from orchestration, registry, API, database, broker, cloud SDK, and UI.
    - Default to one secret-free Docker command on Linux, macOS, and Windows.
    - Resolve reuse improvements as patch-now, backlog, or reject after measured evidence.
rules:
  reference-reuse:
    - Prioritize local skills and `.portfolio/`; external repositories are attributed organizational references unless a decision explicitly accepts code reuse.
  intent:
    - Keep the claim README-ready and measure lifecycle, model quality, and serving behavior separately.
  architecture-record:
    - Explain the dominant problem force before naming an architecture.
    - Include SOLID, LSP, DIP, KISS, YAGNI, DRY, dependency direction, and testability evidence.
  self-challenge:
    - Ask whether Airflow, MLflow, a broker, cloud, microservices, drift, and each abstraction solve a present measured force.
    - Reject or defer every choice whose answer is no.
  component-pack:
    - Use `mlops-data-platform` and document deviations.
  benchmark-proof:
    - Include metric, unit, command, deterministic fixture, environment, JSON path, registry identifiers, and telemetry evidence.
  reuse-delta:
    - Patch the kit only after the full Docker proof confirms a reusable rule.
  verification:
    - Verify Docker, tests, coverage, benchmark JSON, README, references, reuse review, clean git state, and public CI.
